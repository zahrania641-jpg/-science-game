<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رواد الفضاء في المستقبل 🚀</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#080b2d,#32105c,#102b59);
  color:white;
  text-align:center;
}
.game{
  max-width:650px;
  margin:30px auto;
  padding:25px;
}
h1{font-size:32px}
.card{
  background:rgba(255,255,255,.12);
  padding:25px;
  border-radius:25px;
  box-shadow:0 8px 30px rgba(0,0,0,.3);
}
#question{
  font-size:22px;
  margin:25px 0;
}
button{
  width:100%;
  padding:15px;
  margin:9px 0;
  border:0;
  border-radius:15px;
  font-size:17px;
  cursor:pointer;
}
.answer{background:#eee;color:#222}
.answer:hover{background:#d8caff}
#next{
  background:#7c4dff;
  color:white;
  display:none;
}
#result{
  font-size:20px;
  font-weight:bold;
  min-height:30px;
}
</style>
</head>

<body>

<div class="game">
  <h1>🚀 روّاد الفضاء في المستقبل 🌌</h1>

  <div class="card">
    <p id="score">الدرجة: 0</p>
    <div id="question"></div>
    <div id="answers"></div>
    <p id="result"></p>
    <button id="next" onclick="nextQuestion()">السؤال التالي 🚀</button>
  </div>
</div>

<script>

const questions = [

{
 question:"ما الهدف من إرسال روّاد الفضاء إلى الفضاء؟",
 answers:[
 "استكشاف الفضاء وإجراء الأبحاث",
 "اللعب فقط",
 "البحث عن الذهب فقط",
 "مشاهدة الأرض من بعيد فقط"
 ],
 correct:0
},

{
 question:"ما الذي يحتاجه رائد الفضاء للتنفس خارج المركبة؟",
 answers:[
 "ماء فقط",
 "بدلة ونظام لتوفير الأكسجين",
 "نظارات شمسية",
 "مظلة"
 ],
 correct:1
},

{
 question:"لماذا يصعب العيش على كوكب آخر؟",
 answers:[
 "لأن الكواكب لا تتحرك",
 "بسبب اختلاف البيئة والهواء والحرارة والجاذبية",
 "لأن الفضاء مظلم فقط",
 "لأن النجوم قريبة"
 ],
 correct:1
},

{
 question:"أي تقنية يمكن أن تساعد روّاد الفضاء في المستقبل؟",
 answers:[
 "الروبوتات والذكاء الاصطناعي",
 "الورق فقط",
 "الساعات الرملية",
 "الشموع"
 ],
 correct:0
},

{
 question:"ما الكوكب الذي يُدرس كثيرًا لاحتمال وجود مستوطنات بشرية مستقبلية؟",
 answers:[
 "المريخ",
 "عطارد",
 "المشتري",
 "نبتون"
 ],
 correct:0
},

{
 question:"ماذا يحدث لجسم الإنسان عند قضاء وقت طويل في بيئة قليلة الجاذبية؟",
 answers:[
 "لا يحدث أي تغيير",
 "قد تضعف العضلات والعظام",
 "يصبح الإنسان أطول فورًا",
 "يتوقف القلب"
 ],
 correct:1
}

];

let current=0;
let score=0;

function showQuestion(){

 const q=questions[current];

 document.getElementById("question").textContent=q.question;

 const box=document.getElementById("answers");
 box.innerHTML="";

 document.getElementById("result").textContent="";
 document.getElementById("next").style.display="none";

 q.answers.forEach((answer,index)=>{

   const btn=document.createElement("button");

   btn.className="answer";
   btn.textContent=answer;

   btn.onclick=()=>checkAnswer(index);

   box.appendChild(btn);
 });
}

function checkAnswer(choice){

 const q=questions[current];
 const buttons=document.querySelectorAll(".answer");

 buttons.forEach(b=>b.disabled=true);

 if(choice===q.correct){
   score++;
   document.getElementById("result").textContent="🎉 إجابة صحيحة!";
 }else{
   document.getElementById("result").textContent="❌ إجابة غير صحيحة";
 }

 document.getElementById("score").textContent="الدرجة: "+score;

 document.getElementById("next").style.display="block";
}

function nextQuestion(){

 current++;

 if(current<questions.length){
   showQuestion();
 }else{

   document.getElementById("question").textContent="🌟 انتهت الرحلة الفضائية!";

   document.getElementById("answers").innerHTML="";

   document.getElementById("result").textContent=
   "🚀 نتيجتك: "+score+" من "+questions.length;

   document.getElementById("next").style.display="none";
 }
}

showQuestion();

</script>

</body>
</html>
