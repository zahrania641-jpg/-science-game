<style>

}

body {

.game {

.progress {

}

    padding: 20px;

}

.answers button {

    border-radius: 15px;

    padding: 15px;

    margin: 7px 0;

    font-size: 17px;

    cursor: pointer;

    color: white;

    background: #202b5d;

    transition: 0.2s;
}

.answers button:hover {
    background: #344584;
    transform: scale(1.01);
}

.answers button:disabled {

}

.answers button.correct {

}

.answers button.wrong {
    background: #a83232 !important;
}

.result {
    display: none;

    margin-top: 18px;

    padding: 18px;

    border-radius: 17px;

    line-height: 1.8;

    font-size: 16px;
}

.correct-result {

    border: 2px solid #32d58a;
}

.wrong-result {
    background: rgba(168, 50, 50, 0.18);

    border: 2px solid #ff7373;
}

.correct-answer {
    background: rgba(22, 131, 79, 0.25);

    border-radius: 12px;

    padding: 12px;

    margin: 12px 0;
}

    width: 100%;

    border: none;

    border-radius: 15px;

    padding: 15px;

}

.final {

}

.final h2 {

}

.final p {
    font-size: 19px;
    line-height: 1.8;

.restart {

    background: #6c63ff;

    color: white;

</head>

let current = 0;
let score = 0;


const questionElement = document.getElementById("question");
const answersElement = document.getElementById("answers");
const resultElement = document.getElementById("result");
const nextButton = document.getElementById("next");

const scoreElement = document.getElementById("score");
const progressElement = document.getElementById("progress");

const quizElement = document.getElementById("quiz");
const finalElement = document.getElementById("final");
const finalText = document.getElementById("finalText");


function showQuestion() {

    const q = questions[current];

    questionElement.textContent = q.question;

    progressElement.textContent =
        "السؤال " + (current + 1) +
        " من " + questions.length;

    answersElement.innerHTML = "";

    resultElement.style.display = "none";

    nextButton.style.display = "none";

    nextButton.textContent = "السؤال التالي 🚀";


    q.answers.forEach((answer, index) => {

        const button = document.createElement("button");

        button.textContent =
            String.fromCharCode(1571 + index) +
            " - " +
            answer;

        button.onclick = function() {
            checkAnswer(index, button);
        };

        answersElement.appendChild(button);

    });

}


function checkAnswer(selected, clickedButton) {

    const q = questions[current];

    const buttons =
        answersElement.querySelectorAll("button");


    buttons.forEach(function(button) {
        button.disabled = true;
    });


    if (selected === q.correct) {

        clickedButton.classList.add("correct");

        score++;

        scoreElement.textContent = score;


        resultElement.className =
            "result correct-result";


        resultElement.innerHTML = `

            <div style="font-size:22px;">
                ✅ <strong>إجابة صحيحة!</strong>
            </div>

            <br>

            <div>
                💡 <strong>السبب:</strong>
                <br>
                ${q.explanation}
            </div>

        `;

    }

    else {

        clickedButton.classList.add("wrong");

        // إظهار الإجابة الصحيحة باللون الأخضر
        buttons[q.correct].classList.add("correct");


        resultElement.className =
            "result wrong-result";


        resultElement.innerHTML = `

            <div style="
                font-size:22px;
                margin-bottom:12px;
            ">
                ❌ <strong>إجابة غير صحيحة</strong>
            </div>


            <div class="correct-answer">

                ✅ <strong>الإجابة الصحيحة:</strong>

                <br>

                ${q.answers[q.correct]}

            </div>


            <div>

                💡 <strong>السبب:</strong>

                <br>

                ${q.explanation}

            </div>

        `;

    }


    resultElement.style.display = "block";


    if (current < questions.length - 1) {

        nextButton.style.display = "block";

    }

    else {

        nextButton.textContent =
            "عرض النتيجة 🏆";

        nextButton.style.display = "block";

    }

}


function nextQuestion() {

    current++;


    if (current < questions.length) {

        showQuestion();

    }

    else {

        quizElement.style.display = "none";

        finalElement.style.display = "block";


        let message;


        if (score >= 18) {

            message =
                "🌟 ممتاز! واضح أنك مستعدة لمهمة فضائية!";

        }

        else if (score >= 14) {

            message =
                "🚀 رائع! عندك معرفة جميلة بعالم الفضاء.";

        }

        else if (score >= 10) {

            message =
                "🌌 جيد جدًا! ومع بعض المراجعة بتصيرين أفضل.";

        }

        else {

            message =
                "🛰️ تجربة جميلة! جربي مرة ثانية وشوفي كم تقدرين تجيبين.";

        }


        finalText.innerHTML = `

            حصلتِ على

            <strong>
                ${score} / ${questions.length}
            </strong>

            <br><br>

            ${message}

        `;

    }

}


function restartGame() {

    current = 0;

    score = 0;

    scoreElement.textContent = "0";

    finalElement.style.display = "none";

    quizElement.style.display = "block";

    showQuestion();

}


showQuestion();

</script>

</body>
</html>
